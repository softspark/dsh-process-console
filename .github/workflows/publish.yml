name: Publish

on:
  push:
    tags: ['v*']

# Publish only. Every gate ran locally in scripts/release.sh before this tag
# existed; nothing here re-runs them. See kb/procedures/sop-release.md.

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@softspark'
      - name: Tag matches package.json and CHANGELOG
        run: node scripts/verify-version-sync.mjs --tag "${GITHUB_REF_NAME}"
      # lib/ is gitignored: the published artefact is built here from the
      # locked graph. `build` ends by checking every export target exists.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Publish public package with provenance
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
